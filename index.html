<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>MM Cars - Generator Premium v31 (Stała rozdzielczość 1024x768)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6f9; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-top: 0; }
        .section { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #334155; }
        input[type="text"], select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .file-upload { border: 2px dashed #94a3b8; padding: 30px; text-align: center; background: #f8fafc; border-radius: 6px; cursor: pointer; margin-top: 15px; }
        .file-upload:hover { background: #f1f5f9; border-color: #64748b; }
        button { background: #0b192c; color: white; border: none; padding: 15px 25px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 20px; transition: background 0.2s; }
        button:hover { background: #1e3a8a; }
        #previewContainer { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .preview-box { border: 1px solid #e2e8f0; padding: 5px; background: #fff; border-radius: 4px; text-align: center; }
        .preview-box img { max-width: 100%; height: auto; border-radius: 2px; }
        .status { margin-top: 15px; padding: 10px; border-radius: 6px; display: none; font-weight: bold; text-align: center; }
        .success { background: #dcfce7; color: #15803d; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>MM Cars - Generator Premium v31 (Auto-skalowanie 1024x768)</h1>
    
    <h3 style="color: #1e293b; margin-bottom: 10px;">1. Napisy na dole</h3>
    <div class="section grid-3">
        <div>
            <label for="dealerInput">Dealer:</label>
            <input type="text" id="dealerInput" value="OTOMOTO MM CARS">
        </div>
        <div>
            <label for="brandInput">Środek paska:</label>
            <input type="text" id="brandInput" value="SUZUKI">
        </div>
        <div>
            <label for="locationInput">Lokalizacja:</label>
            <input type="text" id="locationInput" value="ZABRZE">
        </div>
    </div>

    <h3 style="color: #1e293b; margin-bottom: 10px;">2. Lewy Górny Róg - Dane techniczne</h3>
    <div class="section grid-3" style="background: #f8fafc; padding: 15px; border-radius: 6px; border: 1px solid #e2e8f0;">
        <div>
            <label for="topLeft1">Rubryka góra 1:</label>
            <input type="text" id="topLeft1" value="Klima 2 strefowa">
        </div>
        <div>
            <label for="topLeft2">Rubryka góra 2:</label>
            <input type="text" id="topLeft2" value="Rocznik 2026">
        </div>
        <div>
            <label for="topLeft3">Rubryka góra 3:</label>
            <input type="text" id="topLeft3" value="4 cylindrowy">
        </div>
    </div>

    <h3 style="color: #1e293b; margin-bottom: 10px;">3. Prawa krawędź - Finansowanie</h3>
    <div class="section grid-3">
        <div>
            <label for="text1">Wyróżnik 1 (Góra):</label>
            <input type="text" id="text1" value="Kredyt 50/50">
        </div>
        <div>
            <label for="text2">Wyróżnik 2 (Środek):</label>
            <input type="text" id="text2" value="Kredyt 3x33%">
        </div>
        <div>
            <label for="text3">Wyróżnik 3 (Dół):</label>
            <input type="text" id="text3" value="Leasing 100,2%">
        </div>
    </div>

    <h3 style="color: #1e293b; margin-bottom: 10px;">4. Kapsuła Gwarancyjna</h3>
    <div class="section grid-3">
        <div>
            <label for="capsuleLeft">Kapsuła - Lewy tekst:</label>
            <input type="text" id="capsuleLeft" value="SUZUKI">
        </div>
        <div>
            <label for="capsuleRight">Kapsuła - Prawy tekst:</label>
            <input type="text" id="capsuleRight" value="DO 10 LAT GWARANCJI +">
        </div>
        <div>
            <label for="badgeColor">Kolor wyróżnika kapsuły:</label>
            <select id="badgeColor">
                <option value="YELLOW">Żółty (Styl Suzuki)</option>
                <option value="GRAFIT">Grafitowy (Premium / Inne marki)</option>
            </select>
        </div>
    </div>

    <div class="section">
        <label>5. Wgraj zdjęcia samochodów:</label>
        <div class="file-upload" onclick="document.getElementById('fileInput').click()">
            <strong style="color: #475569;">Przeciągnij zdjęcia tutaj lub kliknij, aby wybrać z dysku</strong>
            <input type="file" id="fileInput" multiple accept="image/*" style="display:none;" onchange="handleFiles(this.files)">
        </div>
    </div>

    <div id="statusBox" class="status"></div>
    <div id="previewContainer"></div>

    <button id="processBtn" onclick="processImages()">GENERUJ CAŁĄ SERIĘ ZDJĘĆ</button>
</div>

<script>
    let uploadedFiles = [];

    function handleFiles(files) {
        uploadedFiles = Array.from(files);
        const container = document.getElementById('previewContainer');
        container.innerHTML = '';
        
        uploadedFiles.forEach(file => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const box = document.createElement('div');
                box.className = 'preview-box';
                box.innerHTML = `<img src="${e.target.result}">`;
                container.appendChild(box);
            }
            reader.readAsDataURL(file);
        });
        
        const statusBox = document.getElementById('statusBox');
        statusBox.className = "status success";
        statusBox.innerText = `Wczytano zdjęć: ${files.length}`;
    }

    function processImages() {
        if(uploadedFiles.length === 0) {
            alert('Wgraj najpierw zdjęcia!');
            return;
        }

        const dealer = document.getElementById('dealerInput').value.trim();
        const markaPasek = document.getElementById('brandInput').value.trim();
        const miasto = document.getElementById('locationInput').value.trim();

        const tl1 = document.getElementById('topLeft1').value;
        const tl2 = document.getElementById('topLeft2').value;
        const tl3 = document.getElementById('topLeft3').value;

        const t1 = document.getElementById('text1').value;
        const t2 = document.getElementById('text2').value;
        const t3 = document.getElementById('text3').value;
        
        const tCapLeft = document.getElementById('capsuleLeft').value.trim();
        const tCapRight = document.getElementById('capsuleRight').value.trim();
        const kolorKapsuly = document.getElementById('badgeColor').value;

        uploadedFiles.forEach((file) => {
            const imgReader = new FileReader();
            imgReader.onload = function(event) {
                const carImg = new Image();
                carImg.src = event.target.result;
                
                carImg.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    // ZMIANA KLUCZOWA: Wymuszamy stałe wymiary robocze dla każdego zdjęcia, niezależnie od pliku źródłowego
                    canvas.width = 1024;
                    canvas.height = 768;

                    // Rysujemy wgrane zdjęcie rozciągając / pasując je automatycznie do sztywnej siatki 1024x768
                    ctx.drawImage(carImg, 0, 0, 1024, 768);

                    // Od teraz stałe bazowe wyliczone idealnie dla rozdzielczości 1024x768
                    const footerHeight = 76.8; 

                    // 2. STYLIZACJA STOPKI (Roboto Condensed Black)
                    ctx.save(); 
                    ctx.fillStyle = "#ffffff";
                    
                    const finalFontSize = 27; // Stały, zoptymalizowany rozmiar czcionki w pikselach
                    ctx.font = `900 ${finalFontSize}px 'Roboto Condensed', sans-serif`;
                    ctx.textBaseline = "alphabetic";
                    ctx.textAlign = "right"; 
                    
                    const footerText = `${dealer}        ${markaPasek}        ${miasto}`;
                    
                    // Sztywne pozycjonowanie osi Y i X dla rozdzielczości 1024
                    const textYPosition = 768 - 8.5; // Zapewnia idealną wysokość dopasowaną do Otomoto
                    const textXPosition = 1024 - 71;
                    
                    ctx.shadowColor = "rgba(0, 0, 0, 0.4)";
                    ctx.shadowBlur = 3;
                    ctx.shadowOffsetX = 1;
                    ctx.shadowOffsetY = 1;
                    ctx.letterSpacing = "2px"; 
                    
                    ctx.transform(1, 0, -0.15, 1, 0, 0);
                    
                    const skewCorrectionX = textYPosition * 0.15;
                    ctx.fillText(footerText, textXPosition + skewCorrectionX, textYPosition);
                    
                    ctx.restore();


                    // 3. LEWY GÓRNY RÓG
                    const topLeftHeight = 48;
                    const topLeftX = 0; 
                    let topLeftY = 107; 
                    const topLeftGap = 9;

                    const leftTexts = [tl1, tl2, tl3];
                    leftTexts.forEach(text => {
                        if(text.trim() !== "") {
                            const fontSize = 26;
                            ctx.font = `900 ${fontSize}px 'Segoe UI', Arial, sans-serif`;
                            
                            const dynamicLeftWidth = ctx.measureText(text).width + 50;

                            ctx.fillStyle = "rgba(8, 22, 43, 0.85)";
                            ctx.beginPath();
                            ctx.roundRect(topLeftX, topLeftY, dynamicLeftWidth, topLeftHeight, [0, 6, 6, 0]);
                            ctx.fill();

                            ctx.fillStyle = "#ffffff";
                            ctx.textAlign = "center";
                            ctx.textBaseline = "middle";
                            
                            ctx.fillText(text, topLeftX + (dynamicLeftWidth / 2), topLeftY + (topLeftHeight / 2));
                            topLeftY += topLeftHeight + topLeftGap;
                        }
                    });


                    // 4. EMBLEMAT GWARANCJI
                    if(tCapRight !== "") {
                        const badgeGwarHeight = 52; 
                        const badgeGwarY = 768 - 76.8 - 52 - 4; 
                        
                        ctx.font = `900 24px 'Segoe UI', Arial, sans-serif`;
                        ctx.textBaseline = "middle";
                        
                        const textLeftWidth = ctx.measureText(`  ${tCapLeft}  `).width + 30;
                        const textRightWidth = ctx.measureText(`  ${tCapRight}  `).width + 35;
                        
                        const totalGwarWidth = textLeftWidth + textRightWidth;
                        const startGwarX = 1024 - totalGwarWidth - 51; 

                        if (kolorKapsuly === "YELLOW") {
                            ctx.fillStyle = "#ebd600"; 
                        } else {
                            ctx.fillStyle = "#334155"; 
                        }
                        
                        ctx.beginPath();
                        ctx.roundRect(startGwarX, badgeGwarY, textLeftWidth + 15, badgeGwarHeight, [badgeGwarHeight/2, 0, 0, badgeGwarHeight/2]);
                        ctx.fill();

                        ctx.fillStyle = (kolorKapsuly === "YELLOW") ? "#111111" : "#ffffff";
                        ctx.textAlign = "left";
                        ctx.fillText(tCapLeft, startGwarX + 25, badgeGwarY + (badgeGwarHeight / 2));

                        ctx.fillStyle = "#0a0a0a";
                        ctx.beginPath();
                        ctx.roundRect(startGwarX + textLeftWidth, badgeGwarY, textRightWidth, badgeGwarHeight, [0, badgeGwarHeight/2, badgeGwarHeight/2, 0]);
                        ctx.fill();

                        ctx.fillStyle = "#ffffff";
                        ctx.fillText(tCapRight, startGwarX + textLeftWidth + 15, badgeGwarY + (badgeGwarHeight / 2));
                    }


                    // 5. TRZY PRAWE BELKI FINANSOWE
                    const badgeHeight = 54; 
                    let startY = 422; 
                    const gap = 11;

                    const finTexts = [t1, t2, t3];

                    finTexts.forEach(text => {
                        if(text.trim() !== "") {
                            const fontSize = 30;
                            ctx.font = `900 ${fontSize}px 'Segoe UI', Arial, sans-serif`;
                            
                            const dynamicBadgeWidth = ctx.measureText(text).width + 50;
                            const dynamicStartX = 1024 - dynamicBadgeWidth;

                            ctx.fillStyle = "rgba(8, 22, 43, 0.85)"; 
                            ctx.beginPath();
                            ctx.roundRect(dynamicStartX, startY, dynamicBadgeWidth, badgeHeight, [10, 0, 0, 10]);
                            ctx.fill();

                            ctx.fillStyle = "#ffffff";
                            ctx.textAlign = "center";
                            ctx.textBaseline = "middle";

                            ctx.fillText(text, dynamicStartX + (dynamicBadgeWidth / 2), startY + (badgeHeight / 2));
                            startY += badgeHeight + gap;
                        }
                    });

                    // 6. Eksport pliku w doskonałej wadze i kompresji
                    const link = document.createElement('a');
                    link.download = `MM_CARS_1024x768_${file.name.split('.')[0]}.jpg`;
                    link.href = canvas.toDataURL('image/jpeg', 0.92);
                    link.click();
                };
            };
            imgReader.readAsDataURL(file);
        });
    }
</script>

</body>
</html>
